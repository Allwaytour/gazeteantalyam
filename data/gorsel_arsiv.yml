aciklama: 'Doğrulanmış görsel arşivi (t1). Her kayıt: kimlik, kullanım bağlamı (anahtar: başlıkta ya da spotta geçmeli; gerekli: ayrıca geçmesi gereken bağlam; yasak: varsa kullanılmaz), kullanıcı önceliği (2 kişi, 3 kurum/takım/tesis/logo, 4 konu, 5 yer), lisans ve atıf. ''kutuphane'' alanı olanların görsel ve kaynak bilgisi Gemini ile doğrulanmış görsel kütüphanesinden okunur. Commons kayıtları editör tarafından görsel olarak incelendi; lisans Commons dosya sayfasından alındı. Bilinen yanlış (ret kaydı/inceleme) fotoğraflar hiçbir habere verilmez.'
