# Gazete Antalya yönetim paneli ayarları (Sveltia CMS)
backend:
  name: github
  repo: Allwaytour/gazeteantalyam
  branch: main
  # Giriş: GitHub erişim anahtarı (token) ile. "GitHub ile giriş" düğmesi ayrı bir OAuth sunucusu gerektirdiği için kapalı.
  auth_methods: [token]
  commit_messages:
    create: "Yeni haber: {{slug}}"
    update: "Haber güncellendi: {{slug}}"
    delete: "Haber silindi: {{slug}}"
    uploadMedia: "Görsel yüklendi: {{path}}"
    deleteMedia: "Görsel silindi: {{path}}"

site_url: https://www.gazeteantalyam.com
display_url: https://www.gazeteantalyam.com
logo:
  src: /favicon.png

media_folder: static/images/haberler
public_folder: /images/haberler

# Yüklenen fotoğraflar tarayıcıda küçültülür (en uzun kenar 1920 px, WebP): telefondan çekilen 5-10 MB'lık
# fotoğraflar sayfayı yavaşlatmasın. iPhone HEIC fotoğrafları da otomatik dönüştürülür.
media_libraries:
  default:
    config:
      max_file_size: 26214400
      slugify_filename: true
      filename_template: "{{year}}{{month}}{{day}}-{{filename}}-{{uuid_short}}"
      transformations:
        raster_image: { format: webp, quality: 82, width: 1920, height: 1920 }

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: haber
    label: Haberler
    label_singular: Haber
    description: Elle eklenen ve otomatik gelen tüm haberler. Kaydet'e bastığınızda haber ayrıca onay gerekmeden yayına gönderilir; 2-4 dakika içinde sitede görünür.
    folder: content/haber
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    identifier_field: title
    thumbnail: gorsel
    summary: "{{title}} — {{date | date('DD.MM.YYYY HH:mm')}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    view_filters:
      - { label: Otomatik haberler, field: otomatik, pattern: true }
      - { label: Manşettekiler, field: manset, pattern: true }
      - { label: Son dakika, field: son_dakika, pattern: true }
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Spot (kısa özet), name: ozet, widget: text, required: false, hint: "Başlığın altında kalın yazıyla görünür. 1-2 cümle." }
      - { label: Yayın tarihi, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", default: "{{now}}", required: false, hint: "Kendiliğinden şu anki saat yazılır; değiştirmeniz gerekmez. İleri bir tarih seçerseniz haber o saatten sonraki ilk güncellemede yayımlanır." }
      - { label: Kapak fotoğrafı, name: gorsel, widget: image, required: false, hint: "Yatay fotoğraf önerilir. Yalnızca kendi çektiğiniz ya da kullanım izni olan fotoğrafları yükleyin. Fotoğrafı değiştirirseniz aşağıdaki 'Fotoğraf kredisi' alanını da güncelleyin; otomatik sistem elle konan fotoğrafa dokunmaz." }
      - label: Kategori
        name: kategoriler
        widget: select
        multiple: true
        min: 1
        max: 1
        default: [Gündem]
        options: [Gündem, Asayiş, Ekonomi, Turizm, Spor, Sağlık, Eğitim, Kültür-Sanat, Yaşam]
      - label: İlçe
        name: ilceler
        widget: select
        multiple: true
        required: false
        options: [Akseki, Aksu, Alanya, Demre, Döşemealtı, Elmalı, Finike, Gazipaşa, Gündoğmuş, İbradı, Kaş, Kemer, Kepez, Konyaaltı, Korkuteli, Kumluca, Manavgat, Muratpaşa, Serik]
      - { label: Manşete al, name: manset, widget: boolean, default: false, hint: "Ana sayfadaki büyük slayta eklenir." }
      - { label: Son dakika, name: son_dakika, widget: boolean, default: false, hint: "Üstteki kayan son dakika bandında öne çıkar." }
      - { label: Muhabir / Yazar, name: yazar, widget: string, required: false, default: Gazete Antalya }
      - { label: Fotoğraf kredisi, name: gorsel_kredi, widget: string, required: false, hint: "Haber sayfasında görünmez; alt bölümdeki Fotoğraf Kaynakları sayfasında listelenir. Örn: Fotoğraf: Gazete Antalya" }
      - { label: Etiketler, name: etiketler, widget: list, required: false, hint: "Haberde geçen kişi, kurum ve yer adları; her biri için Ekle düğmesine basın." }
      - { label: Görseli sabitle, name: gorsel_kilit, widget: boolean, required: false, default: false, hint: "Açıksa otomatik görsel seçimi bu haberin görseline dokunmaz." }
      - { label: Haber metni, name: body, widget: markdown, required: false, hint: "Metnin içine fotoğraf eklemek için araç çubuğundaki görsel düğmesini kullanın." }
      # Otomatik haberlerin teknik alanları ve sayfa adresi: formda gösterilmez, değerleri korunur
      - { label: Kaynak adı, name: kaynak, widget: hidden, required: false }
      - { label: Kaynak bağlantısı, name: kaynak_url, widget: hidden, required: false }
      - { label: Otomatik eklendi, name: otomatik, widget: hidden, required: false, default: false }
      - { label: Yapay zekâ ile yazıldı, name: yz, widget: hidden, required: false, default: false }
      - { label: Sayfa adresi, name: url, widget: hidden, required: false }
      - { label: Eski adresler, name: aliases, widget: hidden, required: false }

  - name: kose
    label: Köşe Yazıları
    label_singular: Köşe Yazısı
    description: Yazarlarınızın köşe yazıları. Önce "Yazarlar" bölümünden yazarı ekleyin.
    folder: content/kose
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{yazar}} — {{date | date('DD.MM.YYYY')}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Yazar, name: yazar, widget: relation, collection: yazarlar, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - { label: Yayın tarihi, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: Kısa özet, name: ozet, widget: text, required: false }
      - { label: Yazı, name: body, widget: markdown, hint: "Metnin içine fotoğraf eklemek için araç çubuğundaki görsel düğmesini kullanın." }

  - name: yazarlar
    label: Yazarlar
    label_singular: Yazar
    folder: content/yazarlar
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Ad Soyad, name: title, widget: string }
      - { label: Fotoğraf, name: foto, widget: image, required: false, hint: "Kare, yüzün ortada olduğu bir fotoğraf (ör. 400x400)." }
      - { label: Unvan, name: unvan, widget: string, required: false, hint: "Örn: Gazeteci, Ekonomist" }
      - { label: Kısa özgeçmiş, name: body, widget: markdown, required: false }

  - name: sayfalar
    label: Sayfalar
    files:
      - { label: Künye, name: kunye, file: content/kunye.md, fields: [ { label: Başlık, name: title, widget: string }, { label: URL, name: url, widget: hidden }, { label: İçerik, name: body, widget: markdown } ] }
      - { label: İletişim, name: iletisim, file: content/iletisim.md, fields: [ { label: Başlık, name: title, widget: string }, { label: URL, name: url, widget: hidden }, { label: İçerik, name: body, widget: markdown } ] }
      - { label: Gizlilik Politikası, name: gizlilik, file: content/gizlilik.md, fields: [ { label: Başlık, name: title, widget: string }, { label: URL, name: url, widget: hidden }, { label: İçerik, name: body, widget: markdown } ] }

  - name: ayarlar
    label: Ayarlar
    files:
      - name: site
        label: Site Bilgileri
        file: data/site.yaml
        fields:
          - { label: WhatsApp ihbar hattı, name: whatsapp, widget: string, required: false, hint: "Ülke koduyla, boşluksuz: 905551112233. Boş bırakılırsa buton gizlenir." }
          - { label: E-posta, name: eposta, widget: string }
          - { label: Telefon, name: telefon, widget: string, required: false, hint: "Künye, iletişim sayfası ve alt bölümde görünür. Örn: 0551 340 13 61" }
          - { label: Instagram adresi, name: instagram, widget: string, required: false }
          - { label: X (Twitter) adresi, name: x, widget: string, required: false }
          - { label: Facebook adresi, name: facebook, widget: string, required: false }
          - { label: Üst reklam görseli (logonun yanı), name: reklam_banner, widget: image, required: false, hint: "Yatay görsel, en-boy oranı yaklaşık 3:1 (ör. 960x320). Boş bırakılırsa alan gizlenir." }
          - { label: Reklam bağlantısı, name: reklam_link, widget: string, required: false }
          - { label: Reklam adı, name: reklam_ad, widget: string, required: false }
          - { label: Dikey reklam görseli (kenar sütunları), name: dikey_reklam, widget: image, required: false, hint: "Dikey görsel, 600x1066 (9:16) önerilir. Boş bırakılırsa alan gizlenir." }
          - { label: Dikey reklam bağlantısı, name: dikey_reklam_link, widget: string, required: false, hint: "Web adresi ya da telefon (tel:+905xxxxxxxxx)" }
          - { label: Dikey reklam adı, name: dikey_reklam_ad, widget: string, required: false }
          - { label: Cusdis uygulama kimliği (okur yorumları), name: cusdis_app_id, widget: string, required: false, hint: "cusdis.com'da sitenizi ekleyince verilen App ID. Boşsa yorum kısmı görünmez." }
          - { label: Kategoriler, name: kategoriler, widget: list, hint: "Yeni kategori eklerseniz haber formundaki listeye de eklenmesi gerekir." }
          - { label: İlçeler, name: ilceler, widget: list }
      - name: fotograf_arsivi
        label: Fotoğraf arşivi
        file: data/gorsel_arsivi.yml
        media_folder: /static/images/arsiv
        public_folder: /images/arsiv
        fields:
          - label: Fotoğraflar
            name: fotograflar
            widget: list
            required: false
            summary: "{{ad}}"
            hint: "Kendi çektiğimiz ya da kullanım izni yazılı olarak alınmış yer/kurum/tesis fotoğrafları. Haberde adı geçen yer bu anahtarlarla eşleşirse 'Arşiv' etiketiyle kullanılır."
            fields:
              - { label: Ne gösteriyor, name: ad, widget: string, hint: "Örn: Kepez Belediyesi Stadı" }
              - { label: Fotoğraf, name: gorsel, widget: image }
              - { label: Anahtarlar (yer/kurum/takım adları), name: anahtarlar, widget: list, hint: "Örn: Kepezspor, Kepez Stadı" }
              - { label: Fotoğrafçı / kredi, name: kredi, widget: string, default: Gazete Antalya }
              - { label: Kullanım dayanağı, name: dayanak, widget: string, hint: "Örn: Muhabirimizin çekimi / X Belediyesi'nin yazılı izni (tarih)" }
              - { label: Çekim tarihi, name: tarih, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: false }
      - name: kaynaklar
        label: Haber Kaynakları
        file: kaynaklar.yml
        fields:
          - label: Genel ayarlar
            name: ayarlar
            widget: object
            fields:
              - { label: Yapay zekâ ile özgün haber yaz, name: yapay_zeka, widget: boolean }
              - { label: Günlük yapay zekâ haber sınırı, name: yz_gunluk_limit, widget: number, value_type: int }
              - { label: Her turda en fazla yeni haber, name: tur_basina_haber, widget: number, value_type: int }
              - { label: Kaç saatten eski kaynak haberleri alınmasın, name: en_eski_saat, widget: number, value_type: int }
              - { label: Otomatik haberler kaç gün sonra silinsin, name: en_eski_gun, widget: number, value_type: int }
              - { label: Eski haberlerin görsellerini düzelt, name: gorsel_toplu_duzeltme, widget: boolean, default: false }
              - { label: Turda düzeltilecek eski haber, name: gorsel_duzeltme_tur, widget: number, value_type: int, default: 4 }
              - { label: Turda görseli kontrol edilecek yeni haber, name: gorsel_tur_limit, widget: number, value_type: int, default: 6 }
              - { label: Görsel kontrolü günlük yapay zekâ sınırı, name: gorsel_yz_gunluk, widget: number, value_type: int, default: 100 }
              - { label: Görsel denemesi numarası, name: gorsel_deneme_no, widget: number, value_type: int, default: 1, required: false }
              - { label: Görsel denemesi haberleri, name: gorsel_deneme, widget: list, required: false, field: { label: Dosya adı, name: dosya, widget: string } }
          - label: Kaynaklar
            name: kaynaklar
            widget: list
            summary: "{{ad}}"
            fields:
              - { label: Kaynak adı, name: ad, widget: string }
              - { label: RSS adresi, name: url, widget: string }
              - { label: Sadece Antalya haberlerini al, name: antalya_filtresi, widget: boolean, default: true }
              - { label: Sabit kategori (boşsa otomatik), name: kategori, widget: string, required: false }
