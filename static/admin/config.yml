# Gazete Antalya yönetim paneli ayarları (Sveltia CMS)
backend:
  name: github
  repo: Allwaytour/gazeteantalyam
  branch: main
  commit_messages:
    create: "Yeni haber: {{slug}}"
    update: "Haber güncellendi: {{slug}}"
    delete: "Haber silindi: {{slug}}"

site_url: https://www.gazeteantalyam.com
display_url: https://www.gazeteantalyam.com
logo_url: /favicon.png

media_folder: static/images/haberler
public_folder: /images/haberler

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: haber
    label: Haberler
    label_singular: Haber
    description: Elle eklenen haberler. Kaydettikten 1-2 dakika sonra sitede görünür.
    folder: content/haber
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date | date('DD.MM.YYYY HH:mm')}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Otomatik haberler, field: otomatik, pattern: true }
      - { label: Manşettekiler, field: manset, pattern: true }
      - { label: Son dakika, field: son_dakika, pattern: true }
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Spot (kısa özet), name: ozet, widget: text, required: false, hint: "Başlığın altında kalın yazıyla görünür. 1-2 cümle." }
      - { label: Yayın tarihi, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", hint: "İleri bir tarih seçerseniz haber o saatten sonraki ilk güncellemede yayımlanır." }
      - { label: Kapak fotoğrafı, name: gorsel, widget: image, required: false, hint: "Yatay fotoğraf önerilir (ör. 1200x750)." }
      - label: Kategori
        name: kategoriler
        widget: select
        multiple: true
        min: 1
        max: 1
        default: [Gündem]
        options: [Gündem, Asayiş, Ekonomi, Turizm, Spor, Sağlık, Eğitim, Kültür-Sanat, Yaşam]
      - label: İlçe
        name: ilceler
        widget: select
        multiple: true
        required: false
        options: [Akseki, Aksu, Alanya, Demre, Döşemealtı, Elmalı, Finike, Gazipaşa, Gündoğmuş, İbradı, Kaş, Kemer, Kepez, Konyaaltı, Korkuteli, Kumluca, Manavgat, Muratpaşa, Serik]
      - { label: Manşete al, name: manset, widget: boolean, default: false, hint: "Ana sayfadaki büyük slayta eklenir." }
      - { label: Son dakika, name: son_dakika, widget: boolean, default: false, hint: "Üstteki kayan son dakika bandında öne çıkar." }
      - { label: Muhabir / Yazar, name: yazar, widget: string, required: false, default: Gazete Antalya }
      - { label: Fotoğraf kredisi, name: gorsel_kredi, widget: string, required: false, hint: "Örn: Fotoğraf: AA" }
      - { label: Haber metni, name: body, widget: markdown, required: false }
      - { label: Kaynak adı (otomatik haberler), name: kaynak, widget: string, required: false }
      - { label: Kaynak bağlantısı (otomatik haberler), name: kaynak_url, widget: string, required: false }
      - { label: Otomatik eklendi, name: otomatik, widget: boolean, required: false, default: false, hint: "Otomatik haberler 30 gün sonra silinir. Kalıcı olmasını istiyorsanız kapatın." }
      - { label: Yapay zekâ ile yazıldı, name: yz, widget: boolean, required: false, default: false }

  - name: kose
    label: Köşe Yazıları
    label_singular: Köşe Yazısı
    description: Yazarlarınızın köşe yazıları. Önce "Yazarlar" bölümünden yazarı ekleyin.
    folder: content/kose
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{yazar}} — {{date | date('DD.MM.YYYY')}}"
    sortable_fields: [date, title]
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Yazar, name: yazar, widget: relation, collection: yazarlar, value_field: "{{slug}}", search_fields: [title], display_fields: [title] }
      - { label: Yayın tarihi, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: Kısa özet, name: ozet, widget: text, required: false }
      - { label: Yazı, name: body, widget: markdown }

  - name: yazarlar
    label: Yazarlar
    label_singular: Yazar
    folder: content/yazarlar
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Ad Soyad, name: title, widget: string }
      - { label: Fotoğraf, name: foto, widget: image, required: false, hint: "Kare, yüzün ortada olduğu bir fotoğraf (ör. 400x400)." }
      - { label: Unvan, name: unvan, widget: string, required: false, hint: "Örn: Gazeteci, Ekonomist" }
      - { label: Kısa özgeçmiş, name: body, widget: markdown, required: false }

  - name: sayfalar
    label: Sayfalar
    files:
      - { label: Künye, name: kunye, file: content/kunye.md, fields: [ { label: Başlık, name: title, widget: string }, { label: URL, name: url, widget: hidden }, { label: İçerik, name: body, widget: markdown } ] }
      - { label: İletişim, name: iletisim, file: content/iletisim.md, fields: [ { label: Başlık, name: title, widget: string }, { label: URL, name: url, widget: hidden }, { label: İçerik, name: body, widget: markdown } ] }
      - { label: Gizlilik Politikası, name: gizlilik, file: content/gizlilik.md, fields: [ { label: Başlık, name: title, widget: string }, { label: URL, name: url, widget: hidden }, { label: İçerik, name: body, widget: markdown } ] }

  - name: ayarlar
    label: Ayarlar
    files:
      - name: site
        label: Site Bilgileri
        file: data/site.yaml
        fields:
          - { label: WhatsApp ihbar hattı, name: whatsapp, widget: string, required: false, hint: "Ülke koduyla, boşluksuz: 905551112233. Boş bırakılırsa buton gizlenir." }
          - { label: E-posta, name: eposta, widget: string }
          - { label: Instagram adresi, name: instagram, widget: string, required: false }
          - { label: X (Twitter) adresi, name: x, widget: string, required: false }
          - { label: Facebook adresi, name: facebook, widget: string, required: false }
          - { label: Üst reklam görseli (logonun yanı), name: reklam_banner, widget: image, required: false, hint: "Yatay görsel, en-boy oranı yaklaşık 3:1 (ör. 960x320). Boş bırakılırsa alan gizlenir." }
          - { label: Reklam bağlantısı, name: reklam_link, widget: string, required: false }
          - { label: Reklam adı, name: reklam_ad, widget: string, required: false }
          - { label: Cusdis uygulama kimliği (okur yorumları), name: cusdis_app_id, widget: string, required: false, hint: "cusdis.com'da sitenizi ekleyince verilen App ID. Boşsa yorum kısmı görünmez." }
          - { label: Kategoriler, name: kategoriler, widget: list, hint: "Yeni kategori eklerseniz haber formundaki listeye de eklenmesi gerekir." }
          - { label: İlçeler, name: ilceler, widget: list }
      - name: kaynaklar
        label: Haber Kaynakları
        file: kaynaklar.yml
        fields:
          - label: Genel ayarlar
            name: ayarlar
            widget: object
            fields:
              - { label: Yapay zekâ ile özgün haber yaz, name: yapay_zeka, widget: boolean }
              - { label: Günlük yapay zekâ haber sınırı, name: yz_gunluk_limit, widget: number, value_type: int }
              - { label: Her turda en fazla yeni haber, name: tur_basina_haber, widget: number, value_type: int }
              - { label: Kaynağın fotoğrafını kullan, name: kaynak_gorseli, widget: boolean }
              - { label: Kaç saatten eski kaynak haberleri alınmasın, name: en_eski_saat, widget: number, value_type: int }
              - { label: Otomatik haberler kaç gün sonra silinsin, name: en_eski_gun, widget: number, value_type: int }
          - label: Kaynaklar
            name: kaynaklar
            widget: list
            summary: "{{ad}}"
            fields:
              - { label: Kaynak adı, name: ad, widget: string }
              - { label: RSS adresi, name: url, widget: string }
              - { label: Sadece Antalya haberlerini al, name: antalya_filtresi, widget: boolean, default: true }
              - { label: Sabit kategori (boşsa otomatik), name: kategori, widget: string, required: false }
