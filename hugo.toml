baseURL = "https://www.gazeteantalyam.com/"
languageCode = "tr-TR"
defaultContentLanguage = "tr"
title = "Gazete Antalya"
timeZone = "Europe/Istanbul"
enableRobotsTXT = true
removePathAccents = true
summaryLength = 30

[pagination]
  pagerSize = 20

[taxonomies]
  kategori = "kategoriler"
  ilce = "ilceler"
  etiket = "etiketler"

[sitemap]
  changefreq = "hourly"

[permalinks]
  haber = "/haber/:filename/"
  kose = "/kose/:filename/"

[params]
  slogan = "Antalya'nın haber merkezi"
  aciklama = "Antalya ve ilçelerinden son dakika haberleri, gündem, asayiş, turizm, ekonomi ve spor."
  # Hava durumu konumu (Antalya merkez)
  enlem = 36.8969
  boylam = 30.7133

[outputs]
  home = ["HTML", "RSS", "JSON", "HABERSITEMAP"]

# Google Haberler site haritası (/haber-sitemap.xml)
[outputFormats.HABERSITEMAP]
  mediaType = "application/xml"
  baseName = "haber-sitemap"
  isPlainText = true
  notAlternative = true

[markup.goldmark.renderer]
  unsafe = true


# static/images klasörü ayrıca "assets/img" olarak da kullanılabilsin (görseli yeniden adlandırmak için)
[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/img"

# İlgili haberler: aynı kişi/kurum etiketi en ağır, sonra kategori ve ilçe; yakın tarihliler önce
[related]
  includeNewer = true
  threshold = 60
  toLower = true
  [[related.indices]]
    name = "etiketler"
    weight = 100
  [[related.indices]]
    name = "kategoriler"
    weight = 20
  [[related.indices]]
    name = "ilceler"
    weight = 20
  [[related.indices]]
    name = "date"
    weight = 10
