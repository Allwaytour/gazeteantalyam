# Otomatik haber kaynakları
# Bu dosya yönetim panelinden (Ayarlar > Haber Kaynakları) da düzenlenebilir.
#
# antalya_filtresi: true  -> Kaynaktaki haberlerden yalnızca Antalya veya bir ilçesi geçenler alınır
#                          (ulusal kaynaklar için açık bırakın).
# kategori                -> Boş bırakılırsa haberin kategorisi başlığına göre otomatik bulunur.

ayarlar:
  yapay_zeka: true          # GitHub'da GEMINI_API_KEY tanımlıysa haberleri yapay zekâ özgün olarak yazar
  yz_gunluk_limit: 150      # Günde en fazla kaç haber yapay zekâyla yazılsın (ücretsiz kota için)
  tur_basina_haber: 6       # Her 30 dakikalık turda en fazla kaç yeni haber eklensin
  kaynak_gorseli: false     # kullanılmıyor: kaynak görseli yalnızca data/gorsel_izinleri.yml'de izni kayıtlı kaynaklardan alınır
  en_eski_saat: 24          # Bundan eski kaynak haberleri alınmaz
  en_eski_gun: 0            # 0 = otomatik haberler silinmez (arşiv; arama motorlarındaki sayfalar kalır). Sayı yazılırsa o kadar gün sonra silinir

  # Görsel hattı h1 (scripts/gorsel_hat.py): aday bulma → yayın uygunluğu (lisans, teknik kalite, içerik, haber ilişkisi) → yerleşim.
  # Eski açıklama: izinli aynı olay fotoğrafı → haberin öznesinin (kişi/kurum/takım/tesis) doğrulanmış
  # arşiv fotoğrafı → yer + konu fotoğrafı → uygun haberlerde konuyu doğrudan anlatan ücretsiz fotoğraf → sade kategori kapağı.
  gorsel_toplu_duzeltme: false  # h1 kabul testi tamamlanana kadar kapalı; açılınca önce ana sayfadaki haberler düzeltilir
  gorsel_stok_koru: true        # yeni fotoğraf yoksa, görüntü kontrolünden geçen eski temsilî görsel korunur (genel konulu haberlerde)
  gorsel_toplu_sinir: 160       # bu kural sürümüyle toplu düzeltilecek en fazla haber (0 = sınırsız); 1-2 günlük deneme
  gorsel_duzeltme_tur: 10       # toplu düzeltmede bir turda en fazla kaç haber
  gorsel_tur_limit: 6           # bir turda yeni haberlerden en fazla kaçının görseli kontrol edilsin
  gorsel_aday_butcesi: 5        # bir görüntü kontrolünde en fazla kaç aday (katmanlar arasında dengeli dağıtılır)
  gorsel_kontrol_turu: 2        # adaylar elenirse alternatif sorgularla en fazla kaç kontrol turu
  gorsel_sorgu_butcesi: 12      # bir haber için en fazla kaç serbest metin araması (bütçe dolması "fotoğraf yok" sayılmaz)
  gorsel_yeni_haber_payi: 80    # günlük görsel hakkından yeni haberlere ayrılan pay (toplu düzeltme bunu kullanmaz)
  gorsel_yz_gunluk: 500         # görsel kontrolü için günlük Gemini istek sınırı (metin yazımından ayrı)
  gorsel_deneme_no: 26          # aynı denemeyi yeniden çalıştırmak için artırın
  gorsel_deneme:                # h1 kabul testi: ilk beşi zorunlu hatalı örnekler (haber dosyalarını değiştirmez; sonuç: /gorsel-deneme/)
