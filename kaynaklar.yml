# Otomatik haber kaynakları
# Bu dosya yönetim panelinden (Ayarlar > Haber Kaynakları) da düzenlenebilir.
#
# antalya_filtresi: true  -> Kaynaktaki haberlerden yalnızca Antalya veya bir ilçesi geçenler alınır
#                          (ulusal kaynaklar için açık bırakın).
# kategori                -> Boş bırakılırsa haberin kategorisi başlığına göre otomatik bulunur.

ayarlar:
  yapay_zeka: true          # GitHub'da GEMINI_API_KEY tanımlıysa haberleri yapay zekâ özgün olarak yazar
  yz_gunluk_limit: 150      # Günde en fazla kaç haber yapay zekâyla yazılsın (ücretsiz kota için)
  tur_basina_haber: 6       # Her 30 dakikalık turda en fazla kaç yeni haber eklensin
  kaynak_gorseli: false     # kullanılmıyor: kaynak görseli yalnızca data/gorsel_izinleri.yml'de izni kayıtlı kaynaklardan alınır
  en_eski_saat: 24          # Bundan eski kaynak haberleri alınmaz
  en_eski_gun: 30           # Otomatik haberler bu kadar gün sonra siteden silinir (elle eklenenler silinmez)

  # Görsel seçimi (scripts/gorsel_sec.py): izinli gerçek fotoğraf → haberde adı geçen yerin/kurumun arşiv fotoğrafı
  # → fotoğrafsız kapak. Genel stok fotoğraf kullanılmaz.
  gorsel_toplu_duzeltme: false  # true: eski haberlerin otomatik görselleri her turda küçük gruplar hâlinde düzeltilir
  gorsel_stok_koru: true        # yeni fotoğraf yoksa, görüntü kontrolünden geçen eski temsilî görsel korunur (genel konulu haberlerde)
  gorsel_duzeltme_tur: 8        # toplu düzeltmede bir turda en fazla kaç haber
  gorsel_tur_limit: 6           # bir turda yeni haberlerden en fazla kaçının görseli kontrol edilsin
  gorsel_yeni_haber_payi: 80    # günlük görsel hakkından yeni haberlere ayrılan pay (toplu düzeltme bunu kullanmaz)
  gorsel_yz_gunluk: 500         # görsel kontrolü için günlük Gemini istek sınırı (metin yazımından ayrı)
  gorsel_deneme_no: 10           # aynı denemeyi yeniden çalıştırmak için artırın
  gorsel_deneme:                # karşılaştırmalı deneme (haber dosyalarını değiştirmez); g8: önce Muhittin Böcek, sonra kişi/takım/yer/nesne
