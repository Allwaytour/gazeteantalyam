<aside class="kenar">
  {{ if site.Data.site.dikey_reklam }}{{ partial "vitrin-dikey.html" . }}{{ else }}{{ partial "vitrin.html" "vitrin-kenar" }}{{ end }}
  {{ with first 6 .hepsi }}
  <section>
    <h2 class="kenar-bas">Son eklenenler</h2>
    <ol class="numarali">{{ range . }}<li><a href="{{ .link }}">{{ .baslik }}</a></li>{{ end }}</ol>
  </section>
  {{ end }}
  <section class="hava-kutu">
    <h2 class="kenar-bas">Antalya'da hava</h2>
    <div class="hava-simdi"><span class="der" id="hava-der">–</span><div><b id="hava-durum">Yükleniyor…</b><small id="hava-ek"></small></div></div>
    <div class="hava-gunler" id="hava-gunler"></div>
  </section>
</aside>
