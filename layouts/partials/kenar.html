<aside>
  <div class="kutu hava-kart" id="hava">
    <h4>Antalya Hava Durumu</h4>
    <div class="hava-simdi"><span class="der" id="hava-der">–</span><div><b id="hava-durum">Yükleniyor…</b><br><small id="hava-ek"></small></div></div>
    <div class="hava-gunler" id="hava-gunler"></div>
  </div>
  {{ with first 8 .hepsi }}
  <div class="kutu">
    <h4>Son Eklenenler</h4>
    <ol class="numarali">{{ range . }}<li><a href="{{ .link }}"{{ if .dis }} target="_blank" rel="noopener nofollow"{{ end }}>{{ .baslik }}</a></li>{{ end }}</ol>
  </div>
  {{ end }}
  <div class="kutu">
    <h4>İlçe Haberleri</h4>
    <div class="ilce-bulut">{{ range site.Data.site.ilceler }}<a href="{{ partial "terim-url.html" (slice "ilceler" .) }}">{{ . }}</a>{{ end }}</div>
  </div>
</aside>
