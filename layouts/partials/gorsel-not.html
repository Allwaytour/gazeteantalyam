{{/* Küçük görsel açıklaması. Parametre: dict "tur" "yil" */}}
{{ $t := .tur | default "" }}
{{ if eq $t "arsiv" }}<span class="g-not">Arşiv{{ with .yil }} · {{ . }}{{ end }}</span>{{ else if eq $t "stok" }}<span class="g-not">Temsili görsel</span>{{ else if eq $t "kategori" }}<span class="g-not">Kategori görseli</span>{{ end }}
