name: Haberleri güncelle ve yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # Her 30 dakikada bir (GitHub yoğunluğa göre birkaç dakika geciktirebilir)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Otomatik haberleri hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          pip install -q feedparser requests pyyaml trafilatura googlenewsdecoder
          python scripts/haber_cek.py

      - name: Yeni haberleri kaydet
        run: |
          git config user.name "gazete-antalya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/haber data/otomatik_durum.json data/foto_arsivi.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Otomatik haberler [skip ci]"
            git pull -q --rebase origin main && git push -q origin HEAD:main || echo "Kaydedilemedi, bir sonraki turda tekrar denenecek"
          fi

      - name: Kategori sayfalarını hazırla
        run: python scripts/terimler.py

      - name: Hugo kur
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Siteyi oluştur
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Yayınla
        id: dagit
        uses: actions/deploy-pages@v4
