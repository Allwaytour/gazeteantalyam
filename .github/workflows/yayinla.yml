name: Haberleri güncelle ve yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # Her 30 dakikada bir (GitHub yoğunluğa göre birkaç dakika geciktirebilir)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Panelden kaydedilen haberlerin yayını, süren haber toplama turunu beklemesin (ayrı sıra). Haber turu, siteyi oluşturmadan hemen
# önce en güncel hali çeker; panelden kaydedilen haber onun yayınında da bulunur.
concurrency:
  group: ${{ (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'Yeni haber') || startsWith(github.event.head_commit.message, 'Haber güncellendi') || startsWith(github.event.head_commit.message, 'Haber silindi') || startsWith(github.event.head_commit.message, 'Görsel')) && 'pages-panel') || 'pages' }}
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url || steps.dagit2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # her zaman en güncel hali (sıraya giren eski tetiklemeler eski veriyle çalışmasın)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Panelden (Sveltia CMS) kaydedilen değişiklikler hızlı yayımlanır: haber toplama turu beklenmez.
      - name: Yayın türü
        id: tur
        env:
          MESAJ: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && printf '%s' "$MESAJ" | grep -qE '^(Yeni haber|Haber güncellendi|Haber silindi|Görsel yüklendi|Görsel silindi|Create|Update|Delete|Upload|Uploaded)'; then
            echo "hizli=1" >> "$GITHUB_OUTPUT"; echo "Panelden kayıt: hızlı yayın"
          else
            echo "hizli=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Elle eklenen haberleri hazırla (hızlı yayın)
        if: steps.tur.outputs.hizli == '1'
        run: |
          pip install -q pyyaml
          python scripts/elle_duzelt.py
          git config user.name "gazete-antalya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/haber
          if ! git diff --cached --quiet; then
            git commit -q -m "Elle eklenen haber: tarih/adres düzeltmesi [skip ci]"
            for i in 1 2 3; do (git pull -q --rebase origin main && git push -q origin HEAD:main) && break; sleep 5; done
          fi

      - name: Otomatik haberleri hazırla
        if: steps.tur.outputs.hizli != '1'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          pip install -q feedparser requests pyyaml trafilatura googlenewsdecoder pillow playwright zeyrek
          timeout 22m python -u scripts/haber_cek.py || echo "Haber turu süre sınırında durduruldu; kaydedilenler yayınlanacak"

      - name: Yeni haberleri kaydet
        if: steps.tur.outputs.hizli != '1'
        run: |
          git config user.name "gazete-antalya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/haber data/otomatik_durum.json data/foto_arsivi.json data/gorsel_kutuphanesi.json data/gorsel_ret.json data/gorsel_kabul_orneklem.json
          git add -A static/images/kurum 2>/dev/null || true
          git add -A static/images/haber-gorsel 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Otomatik haberler [skip ci]"
            if ! (git pull -q --rebase origin main && git push -q origin HEAD:main); then
              echo "Kaydedilemedi, bir sonraki turda tekrar denenecek"
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
            fi
          fi

      - name: Kategori sayfalarını hazırla
        run: |
          # bu tur sürerken panelden kaydedilen haberler de yayına girsin
          git pull -q --rebase origin main 2>/dev/null || git pull -q origin main || true
          python scripts/terimler.py

      - name: Hugo kur
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Siteyi oluştur
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # GitHub Pages yayın servisi zaman zaman yanıt vermiyor ("Timeout reached, aborting!").
      # İlk deneme başarısız olursa bir dakika beklenip bir kez daha denenir; site bir sonraki tura kalmaz.
      - name: Yayınla
        id: dagit
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: Yayın servisi yanıt vermedi, bekleniyor
        if: steps.dagit.outcome == 'failure'
        run: sleep 60

      - name: Yayınla (ikinci deneme)
        id: dagit2
        if: steps.dagit.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
