name: Haberleri güncelle ve yayınla

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # Her 30 dakikada bir (GitHub yoğunluğa göre birkaç dakika geciktirebilir)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url || steps.dagit2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # her zaman en güncel hali (sıraya giren eski tetiklemeler eski veriyle çalışmasın)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Otomatik haberleri hazırla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          pip install -q feedparser requests pyyaml trafilatura googlenewsdecoder pillow playwright
          timeout 22m python -u scripts/haber_cek.py || echo "Haber turu süre sınırında durduruldu; kaydedilenler yayınlanacak"

      - name: Yeni haberleri kaydet
        run: |
          git config user.name "gazete-antalya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/haber data/otomatik_durum.json data/foto_arsivi.json
          git add -A static/images/kurum 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Otomatik haberler [skip ci]"
            if ! (git pull -q --rebase origin main && git push -q origin HEAD:main); then
              echo "Kaydedilemedi, bir sonraki turda tekrar denenecek"
              git rebase --abort 2>/dev/null || true
              git fetch -q origin main && git reset -q --hard origin/main
            fi
          fi

      - name: Kategori sayfalarını hazırla
        run: python scripts/terimler.py

      - name: Hugo kur
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Siteyi oluştur
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # GitHub Pages yayın servisi zaman zaman yanıt vermiyor ("Timeout reached, aborting!").
      # İlk deneme başarısız olursa bir dakika beklenip bir kez daha denenir; site bir sonraki tura kalmaz.
      - name: Yayınla
        id: dagit
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000

      - name: Yayın servisi yanıt vermedi, bekleniyor
        if: steps.dagit.outcome == 'failure'
        run: sleep 60

      - name: Yayınla (ikinci deneme)
        id: dagit2
        if: steps.dagit.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
