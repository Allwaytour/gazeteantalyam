# GitHub, 60 gün boyunca hiç değişiklik olmayan depolarda zamanlanmış görevleri durdurur.
# Bu görev ayda bir küçük bir kayıt yaparak otomatik güncellemenin hiç durmamasını sağlar.
name: Otomatik güncellemeyi canlı tut

on:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .canli
          git config user.name "gazete-antalya-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .canli
          git commit -m "Canlı tutma kaydı [skip ci]" || true
          git push
